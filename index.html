<style>
/* =========================================================
   COLORES — cambiá --verde por el tono exacto del logo
   ========================================================= */
:root{
  --verde:#49B114;
  --verde-osc:#2a6e08;
  --verde-claro:#a8e57f;
  --verde-suave:#edf8e5;
  --bg:#f3f6f4;--card:#ffffff;--ink:#0f1512;--muted:#5d6a63;--line:#e0e8e3;
  --sombra:0 1px 2px rgba(15,21,18,.04),0 8px 24px -12px rgba(15,21,18,.18);
  --radio:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --verde:#5cc627;--verde-osc:#1f5206;--verde-claro:#b5ec8f;--verde-suave:#16290c;
    --bg:#0b0f0d;--card:#151b18;--ink:#eef4f0;--muted:#93a39a;--line:#232d28;
    --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --verde:#5cc627;--verde-osc:#1f5206;--verde-claro:#b5ec8f;--verde-suave:#16290c;
  --bg:#0b0f0d;--card:#151b18;--ink:#eef4f0;--muted:#93a39a;--line:#232d28;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* ================= HERO ================= */
.hero{position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(140deg,var(--verde-osc) 0%,var(--verde) 60%,#6cc93a 100%);
  background-size:180% 180%;animation:fondo 14s ease-in-out infinite;
  padding:calc(18px + env(safe-area-inset-top)) 0 64px;border-radius:0 0 32px 32px}
@keyframes fondo{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.burbuja{position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.b1{width:260px;height:260px;right:-80px;top:-90px;animation:flotar 9s ease-in-out infinite}
.b2{width:120px;height:120px;left:-40px;bottom:-30px;animation:flotar 11s ease-in-out infinite reverse}
.b3{width:60px;height:60px;right:22%;bottom:26px;animation:flotar 7s ease-in-out infinite}
@keyframes flotar{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.05)}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:64px;height:auto;color:#fff;flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));
  animation:logoEntra .8s cubic-bezier(.2,.8,.2,1) both}
.logo svg{width:100%;height:auto;display:block}
@keyframes logoEntra{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
.logo-grande{position:absolute;right:0;top:50%;width:min(38vw,380px);color:#fff;opacity:.12;transform:translateY(-50%);pointer-events:none}
.logo-grande svg{width:100%;height:auto;display:block}
@media (max-width:759px){.logo-grande{display:none}}
.brand-name{font:900 1.45rem/1 "Barlow Condensed",sans-serif;letter-spacing:.06em}
.brand-sub{font-size:.7rem;opacity:.85;letter-spacing:.22em;text-transform:uppercase;margin-top:3px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer;color:#fff}
.icon-btn svg{width:20px;height:20px}
.hero .wrap{position:relative}
.hero-txt{position:relative;z-index:1;margin-top:26px}
.saludo{font-weight:600;opacity:.9;font-size:.95rem;animation:entrar .7s both}
.hero h1{font:900 clamp(2.6rem,9vw,4.2rem)/.9 "Barlow Condensed",sans-serif;text-transform:uppercase;
  margin:6px 0 12px;letter-spacing:.005em;animation:entrar .7s .08s both}
.hero h1 em{font-style:normal;color:var(--verde-claro);display:inline-block}
.hero p{margin:0;opacity:.92;max-width:520px;animation:entrar .7s .16s both}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;animation:entrar .7s .24s both}
.chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px);
  padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:600;display:flex;gap:6px;align-items:center}
@keyframes entrar{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ================= SELECTOR DE DÍAS ================= */
.dias{position:relative;z-index:2;margin-top:-40px}
.dias-scroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:4px 16px 14px;margin:0 -16px;scrollbar-width:none}
.dias-scroll::-webkit-scrollbar{display:none}
.dia-card{scroll-snap-align:start;flex:0 0 132px;background:var(--card);border:2px solid transparent;
  border-radius:18px;padding:12px;box-shadow:var(--sombra);cursor:pointer;text-align:left;
  transition:transform .2s,border-color .2s,background .2s;position:relative;overflow:hidden}
.dia-card:active{transform:scale(.96)}
.dia-emoji{font-size:1.5rem;line-height:1}
.dia-titulo{font:800 1.25rem "Barlow Condensed",sans-serif;text-transform:uppercase;margin-top:6px}
.dia-titulo.largo{font-size:1.02rem;padding-top:3px}
.dia-foco{font-size:.74rem;color:var(--muted);line-height:1.25;min-height:2.5em}
.dia-barra{height:4px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.dia-barra span{display:block;height:100%;width:0;background:var(--verde);transition:width .4s}
.dia-card.activo{border-color:var(--verde);background:linear-gradient(180deg,var(--verde-suave),var(--card))}
.hoy-tag{position:absolute;top:8px;right:8px;background:var(--verde);color:#fff;font-size:.62rem;
  font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.04em}
.dia-card.completo .dia-emoji::after{content:" ✅";font-size:1rem}

/* ================= CONTENIDO ================= */
main{padding:10px 0 120px}
.cabecera{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 6px}
.cabecera h2{font:900 2.3rem/1 "Barlow Condensed",sans-serif;text-transform:uppercase;margin:0}
.badge{background:var(--verde-suave);color:var(--verde-osc);font-weight:700;font-size:.85rem;
  padding:6px 12px;border-radius:10px}
:root[data-theme="dark"] .badge{color:var(--verde-claro)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:var(--verde-claro)}}
.nota{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;color:var(--muted);font-size:.92rem;margin:12px 0}
.nota b{color:var(--ink)}
.progreso{display:flex;align-items:center;gap:12px;margin:14px 0 18px}
.anillo{width:52px;height:52px;flex:0 0 auto;position:relative}
.anillo svg{width:100%;height:100%;transform:rotate(-90deg)}
.anillo circle{fill:none;stroke-width:6}
.anillo .fondo{stroke:var(--line)}
.anillo .valor{stroke:var(--verde);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.anillo span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:.8rem}
.progreso-txt b{display:block;font-size:1rem}
.progreso-txt small{color:var(--muted)}

.bloque{margin-bottom:22px}
.bloque-head{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.bloque-num{width:30px;height:30px;border-radius:10px;background:var(--verde);color:#fff;
  display:grid;place-items:center;font:900 1.1rem "Barlow Condensed",sans-serif}
.bloque-titulo{font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ejercicios{display:grid;gap:12px}
@media (min-width:760px){.ejercicios{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.ejercicios.tres{grid-template-columns:repeat(3,1fr)}}

.ej{background:var(--card);border:1px solid var(--line);border-radius:var(--radio);overflow:hidden;
  box-shadow:var(--sombra);transition:transform .25s,box-shadow .25s,border-color .25s;
  opacity:0;transform:translateY(18px)}
.ej.visible{opacity:1;transform:none;transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1),border-color .25s}
@media (hover:hover){.ej.visible:hover{transform:translateY(-3px);box-shadow:0 16px 34px -16px rgba(15,21,18,.35)}}
.ej.hecho{border-color:var(--verde)}
.ej-info{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 12px}
.ej-num{font:900 1.6rem/1 "Barlow Condensed",sans-serif;color:var(--verde);opacity:.35;min-width:22px}
.ej-nombre{font-weight:700;font-size:1.02rem;line-height:1.25}
.ej.hecho .ej-nombre{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--verde-suave);color:var(--verde-osc)}
:root[data-theme="dark"] .tag{color:var(--verde-claro)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:var(--verde-claro)}}
.tag.aviso{background:#fef3c7;color:#92400e}
:root[data-theme="dark"] .tag.aviso{background:#3a2a0a;color:#fbbf24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.aviso{background:#3a2a0a;color:#fbbf24}}

.check{margin-left:auto;flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:2px solid var(--line);
  background:var(--card);cursor:pointer;display:grid;place-items:center;transition:.2s}
.check svg{width:20px;height:20px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .05s}
.ej.hecho .check{background:var(--verde);border-color:var(--verde);animation:pop .35s}
.ej.hecho .check svg{stroke-dashoffset:0}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ----- Video ----- */
.videos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 14px 14px}
.videos::-webkit-scrollbar{display:none}
.video{position:relative;flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/9;border-radius:14px;
  overflow:hidden;background:#000;cursor:pointer}
.videos.varios .video{flex-basis:88%}
.video img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s,filter .3s;filter:brightness(.82)}
@media (hover:hover){.video:hover img{transform:scale(1.05);filter:brightness(.7)}}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{width:62px;height:62px;border-radius:50%;background:var(--verde);display:grid;place-items:center;
  box-shadow:0 0 0 0 rgba(73,177,20,.6);animation:latido 2.2s infinite}
.play svg{width:24px;height:24px;fill:#fff;margin-left:4px}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(73,177,20,.55)}70%{box-shadow:0 0 0 18px rgba(73,177,20,0)}100%{box-shadow:0 0 0 0 rgba(73,177,20,0)}}
.video-label{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;
  font-weight:700;padding:4px 8px;border-radius:8px;backdrop-filter:blur(4px)}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video.vacio{background:repeating-linear-gradient(135deg,var(--verde-suave) 0 12px,transparent 12px 24px),var(--bg);
  border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);font-size:.88rem;gap:6px;cursor:default}

.reiniciar{display:block;margin:10px auto 0;background:none;border:1px solid var(--line);color:var(--muted);
  font-weight:600;font-size:.86rem;padding:10px 16px;border-radius:12px;cursor:pointer}

/* ================= TEMPORIZADOR ================= */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;
  background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:14px 18px;font-weight:800;
  display:flex;align-items:center;gap:8px;box-shadow:0 12px 28px -10px rgba(0,0,0,.5);cursor:pointer;
  transition:transform .2s}
.fab:active{transform:scale(.95)}
.fab svg{width:20px;height:20px}
.fab.corriendo{background:var(--verde);color:#fff}
.sheet-fondo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:26px 26px 0 0;
  padding:12px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:520px;margin:0 auto;text-align:center}
.abierto .sheet-fondo{opacity:1;pointer-events:auto}
.abierto .sheet{transform:none}
.asa{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font:900 1.6rem "Barlow Condensed",sans-serif;text-transform:uppercase}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.reloj{width:170px;height:170px;margin:4px auto 16px;position:relative}
.reloj svg{width:100%;height:100%;transform:rotate(-90deg)}
.reloj circle{fill:none;stroke-width:10}
.reloj .fondo{stroke:var(--line)}
.reloj .valor{stroke:var(--verde);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.reloj span{position:absolute;inset:0;display:grid;place-items:center;font:900 3rem "Barlow Condensed",sans-serif}
.tiempos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiempos button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 0;font-weight:800;cursor:pointer}
.tiempos button:active{transform:scale(.95)}
.tiempos button.sel{border-color:var(--verde);background:var(--verde-suave)}
.parar{margin-top:10px;width:100%;border:0;background:none;color:var(--muted);font-weight:600;padding:10px;cursor:pointer}

/* ================= CONFETI / TOAST ================= */
.confeti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;pointer-events:none;border-radius:2px;
  animation:caer linear forwards}
@keyframes caer{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-150%);z-index:61;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;
  box-shadow:0 12px 28px -10px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.toast.ver{transform:translate(-50%,0)}

footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 30px}

@media (min-width:760px){
  .dias-scroll{overflow:visible;flex-wrap:nowrap;margin:0;padding:4px 0 14px}
  .dia-card{flex:1 1 0}
  .hero{padding-bottom:76px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ej{opacity:1;transform:none}
}

/* ================= NAVEGACIÓN ENTRE RUTINAS ================= */
.volver{display:inline-flex;align-items:center;gap:6px;margin-top:18px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:8px 14px 8px 10px;
  font-weight:700;font-size:.88rem;cursor:pointer;position:relative;z-index:1;animation:entrar .5s both}
.volver svg{width:18px;height:18px}
.volver[hidden]{display:none}
.vista-inicio .dias{display:none}
.vista-inicio .hero{padding-bottom:40px}

.seccion-titulo{font:900 1.7rem/1 "Barlow Condensed",sans-serif;text-transform:uppercase;margin:22px 0 4px}
.seccion-sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.filtros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 12px;margin:0 -16px}
.filtros::-webkit-scrollbar{display:none}
.filtro{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:9px 15px;font-weight:700;font-size:.88rem;cursor:pointer;transition:.2s}
.filtro.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rutinas{display:grid;gap:14px}
@media (min-width:640px){.rutinas{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.rutinas{grid-template-columns:repeat(3,1fr)}}
.rut-card{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:22px;
  padding:16px 16px 14px;cursor:pointer;box-shadow:var(--sombra);overflow:hidden;display:flex;flex-direction:column;gap:8px;
  transition:transform .25s,box-shadow .25s,border-color .25s;animation:entrar .5s both}
.rut-card:active{transform:scale(.98)}
@media (hover:hover){.rut-card:hover{transform:translateY(-3px);border-color:var(--verde);box-shadow:0 16px 34px -16px rgba(15,21,18,.35)}}
.rut-card::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--acento,var(--verde))}
.rut-top{display:flex;align-items:center;gap:12px}
.rut-ico{width:46px;height:46px;border-radius:14px;background:var(--verde-suave);display:grid;place-items:center;font-size:1.5rem;flex:0 0 auto}
.rut-nombre{font:900 1.45rem/1 "Barlow Condensed",sans-serif;text-transform:uppercase}
.rut-para{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.rut-desc{color:var(--muted);font-size:.9rem;margin:0}
.rut-tags{display:flex;flex-wrap:wrap;gap:6px}
.rut-ir{display:flex;align-items:center;justify-content:space-between;margin-top:2px;font-weight:800;font-size:.88rem;color:var(--verde-osc)}
:root[data-theme="dark"] .rut-ir{color:var(--verde-claro)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rut-ir{color:var(--verde-claro)}}
.rut-ir svg{width:20px;height:20px;transition:transform .2s}
@media (hover:hover){.rut-card:hover .rut-ir svg{transform:translateX(4px)}}
.rut-barra{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.rut-barra span{display:block;height:100%;background:var(--verde)}
.rut-actual{position:absolute;top:14px;right:14px;background:var(--verde);color:#fff;font-size:.66rem;font-weight:800;
  padding:3px 8px;border-radius:999px;letter-spacing:.05em}

/* ================= EXTRAS DE EJERCICIO ================= */
.bloque.opcional .bloque-num{background:var(--muted)}
.bloque-nota{color:var(--muted);font-size:.85rem;margin:-4px 0 10px 40px}
.bloque-nota.ind{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:-2px 0 12px 0}
.ej-pie{display:flex;align-items:center;gap:8px;padding:0 14px 14px}
.peso{display:flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px}
.peso label{font-size:.76rem;font-weight:700;color:var(--muted)}
.peso input{width:64px;border:0;background:transparent;color:var(--ink);font:700 1rem Inter,sans-serif;padding:6px 0;outline:none}
.peso:focus-within{border-color:var(--verde)}
.peso span{font-size:.78rem;color:var(--muted);font-weight:600}
.cardio{margin:0 14px 14px;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,var(--verde-suave),transparent);border:1px dashed var(--line);color:var(--muted);font-size:.9rem}
.cardio b{display:block;color:var(--ink);font-size:.95rem}
.cardio .ico{font-size:1.6rem}
</style>

/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const leer = (k, def) => { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch(e) { return def; } };
const grabar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

let hechos = leer("hg-hechos", {});
let pesos  = leer("hg-pesos", {});
const guardarHechos = () => grabar("hg-hechos", hechos);

/* ================= estado de navegación ================= */
let rutina = null;   // objeto rutina actual
let actual = null;   // id de la sección/día actual
let filtro = "todas";

const dias = r => r.secciones.filter(s => /^d\d/.test(s.id));
const total = (r, s) => s.bloques.reduce((n, b) => n + b.ej.length, 0);
const pref = (r, s) => `${r.id}/${s.id}/`;
const hechosDe = (r, s) => Object.keys(hechos).filter(k => k.startsWith(pref(r, s)) && hechos[k]).length;
const progresoRutina = r => {
  const ds = dias(r); let t = 0, h = 0;
  ds.forEach(s => { t += total(r, s); h += hechosDe(r, s); });
  return t ? h / t : 0;
};

/* día sugerido según el día de la semana */
function hoyDe(r){
  const d = new Date().getDay(); // 0 domingo
  if(r.dias === 5) return d >= 1 && d <= 5 ? "d" + d : null;
  if(r.dias === 3) return ({1:"d1", 3:"d2", 5:"d3"})[d] || null;
  return null;
}
function saludo(){
  const h = new Date().getHours();
  return h < 12 ? "¡Buen día!" : h < 20 ? "¡Buenas tardes!" : "¡Buenas noches!";
}

/* ================= videos ================= */
function idYT(v){ const m = String(v).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : v; }
function unVideo(v, label){
  if(/\.(mp4|webm|mov)$/i.test(v))
    return `<div class="video"><video src="videos/${esc(v)}" controls playsinline preload="metadata"></video></div>`;
  const id = idYT(v);
  return `<div class="video" data-yt="${esc(id)}" role="button" tabindex="0" aria-label="Reproducir video: ${esc(label)}">
    <img src="https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <div class="play"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></div>
    <span class="video-label">${esc(label)}</span></div>`;
}
function infoEj(it){
  const ids = it.e.split("|");
  const partes = ids.map(id => E[id] || [id, ""]);
  const nombre = it.n || partes.map(p => p[0]).join(" / ");
  const vids = partes.filter(p => p[1]).map(p => ({ v:p[1], label: ids.length > 1 ? p[0] : "Ver técnica" }));
  return { nombre, vids, cardio: ids.every(id => !(E[id] && E[id][1])) };
}

/* ================= pantalla de inicio ================= */
const FILTROS = [["todas","Todas"],["todos","Para todos"],["chicas","Para chicas"],["hombres","Para hombres"],["3","3 días"],["5","5 días"],["movilidad","Movilidad"]];
function pasaFiltro(r){
  if(filtro === "todas") return true;
  if(filtro === "3" || filtro === "5") return String(r.dias) === filtro;
  if(filtro === "movilidad") return r.id === "movilidad";
  return r.para === filtro;
}
function verInicio(){
  document.body.classList.add("vista-inicio");
  rutina = null; actual = null;
  $("#volver").hidden = true;
  $("#saludo").textContent = saludo() + " Bienvenido a House Gym 👋";
  $("#titulo").innerHTML = "Elegí tu <em>rutina</em>";
  $("#desc").textContent = "Tocá la rutina que te dio el profe. Cada ejercicio tiene su video y podés ir tildando lo que hacés.";
  $("#chips").innerHTML = `<span class="chip">📋 ${RUTINAS.length} rutinas</span><span class="chip">🎥 Videos de cada ejercicio</span><span class="chip">✅ Tu progreso guardado</span>`;
  const ultima = leer("hg-rutina", null);
  const lista = RUTINAS.filter(pasaFiltro);
  $("#contenido").innerHTML = `
    <h2 class="seccion-titulo">Rutinas</h2>
    <p class="seccion-sub">Filtrá por tipo o por cantidad de días.</p>
    <div class="filtros" role="group" aria-label="Filtrar rutinas">${FILTROS.map(([k, t]) =>
      `<button class="filtro${k === filtro ? " sel" : ""}" data-f="${k}" aria-pressed="${k === filtro}">${t}</button>`).join("")}</div>
    <div class="rutinas">${lista.map((r, i) => {
      const p = Math.round(progresoRutina(r) * 100);
      return `<button class="rut-card" data-r="${r.id}" style="animation-delay:${i * 60}ms">
        ${r.id === ultima ? '<span class="rut-actual">TU RUTINA</span>' : ""}
        <div class="rut-top"><div class="rut-ico">${r.ico}</div>
          <div><div class="rut-nombre">${esc(r.nombre)}</div><div class="rut-para">${esc(r.paraTxt)}</div></div></div>
        <p class="rut-desc">${esc(r.desc)}</p>
        <div class="rut-tags"><span class="tag">${esc(r.diasTxt || r.dias + " días")}</span><span class="tag">${esc(r.nivel)}</span><span class="tag">${esc(r.objetivo)}</span></div>
        ${p ? `<div class="rut-barra" aria-label="Progreso ${p}%"><span style="width:${p}%"></span></div>` : ""}
        <div class="rut-ir"><span>${p ? "Seguir · " + p + "% hecho" : "Ver rutina"}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
      </button>`; }).join("")}</div>`;
  ponerHash("");
}

/* ================= vista de una rutina ================= */
function verRutina(r, secId, desplazar){
  rutina = r;
  grabar("hg-rutina", r.id);
  document.body.classList.remove("vista-inicio");
  $("#volver").hidden = false;
  const hoy = hoyDe(r);
  const s = r.secciones.find(x => x.id === secId) || r.secciones.find(x => x.id === hoy) || dias(r)[0];
  actual = s.id;
  const hoyS = hoy && r.secciones.find(x => x.id === hoy);
  $("#saludo").textContent = saludo() + (r.saludo ? r.saludo : hoyS ? ` Hoy toca el ${hoyS.titulo} 💪` : " Hoy podés descansar o recuperar un día 😉");
  $("#titulo").innerHTML = esc(r.nombre).replace(/^(\S+)\s(.+)$/, "$1 <em>$2</em>");
  $("#desc").textContent = r.desc;
  $("#chips").innerHTML = `<span class="chip">📅 ${esc(r.diasTxt || r.dias + " días")}</span><span class="chip">🎯 ${esc(r.objetivo)}</span><span class="chip">🔁 ${esc(r.reps)}</span>`;
  pintarDias();
  pintarSeccion(s);
  ponerHash(r.id + "/" + s.id);
  if(desplazar) window.scrollTo({ top: $(".dias").offsetTop - 8, behavior: "smooth" });
}

function pintarDias(){
  const r = rutina, hoy = hoyDe(r);
  $("#dias").innerHTML = r.secciones.map(s => {
    const t = total(r, s), h = hechosDe(r, s);
    return `<button class="dia-card${s.id === actual ? " activo" : ""}${t && h === t ? " completo" : ""}" data-s="${s.id}">
      ${s.id === hoy ? '<span class="hoy-tag">HOY</span>' : ""}
      <div class="dia-emoji">${s.emoji}</div>
      <div class="dia-titulo${s.titulo.length > 8 ? " largo" : ""}">${esc(s.titulo)}</div>
      <div class="dia-foco">${esc(s.foco)}</div>
      <div class="dia-barra"><span style="width:${t ? h / t * 100 : 0}%"></span></div>
    </button>`;
  }).join("");
  const act = $("#dias .activo"), cont = $("#dias");
  if(act && cont.scrollWidth > cont.clientWidth)
    cont.scrollTo({ left: act.offsetLeft - (cont.clientWidth - act.offsetWidth) / 2, behavior: "smooth" });
}

function pintarProgreso(){
  const r = rutina, s = r.secciones.find(x => x.id === actual);
  const t = total(r, s), h = hechosDe(r, s), C = 2 * Math.PI * 22;
  $("#anillo-valor").style.strokeDashoffset = C - C * (h / t);
  $("#anillo-num").textContent = Math.round(h / t * 100) + "%";
  $("#prog-titulo").textContent = h === t ? "¡Completo! 🎉" : h === 0 ? "¡Vamos que arrancamos!" : "¡Bien, seguí así!";
  $("#prog-sub").textContent = `${h} de ${t} ejercicios hechos`;
}

function pintarSeccion(s){
  const r = rutina;
  const esDia = /^d\d/.test(s.id);
  const nota = s.nota || (esDia ? r.nota : "");
  let n = 0, html = `
    <div class="cabecera"><h2>${s.emoji} ${esc(s.titulo)}</h2><span class="badge">${esc(s.foco)}</span></div>
    ${nota ? `<div class="nota">💡<div>${nota}</div></div>` : ""}
    <div class="progreso">
      <div class="anillo"><svg viewBox="0 0 52 52"><circle class="fondo" cx="26" cy="26" r="22"/>
        <circle class="valor" id="anillo-valor" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="138.2"/></svg>
        <span id="anillo-num">0%</span></div>
      <div class="progreso-txt"><b id="prog-titulo"></b><small id="prog-sub"></small></div>
    </div>`;
  let num = 0;
  s.bloques.forEach((b, i) => {
    if(!b.opc) num++;
    const cant = b.ej.length;
    const tipo = cant === 2 ? "superserie" : cant > 2 ? `circuito de ${cant}` : "";
    const titulo = b.titulo ? esc(b.titulo) : b.opc ? "Opcional" + (tipo ? " · " + tipo : "") : (s.bloques.length > 1 ? `Bloque ${num}` + (tipo ? " · " + tipo : "") : (tipo ? tipo[0].toUpperCase() + tipo.slice(1) : ""));
    html += `<section class="bloque${b.opc ? " opcional" : ""}">`;
    if(titulo) html += `<div class="bloque-head"><span class="bloque-num">${b.opc ? "+" : num}</span><span class="bloque-titulo">${titulo}</span></div>`;
    if(b.nota) html += `<div class="bloque-nota">${esc(b.nota)}</div>`;
    if(b.ind) html += `<div class="bloque-nota ind">💡 ${esc(b.ind)}</div>`;
    html += `<div class="ejercicios${cant >= 3 ? " tres" : ""}">`;
    b.ej.forEach((it, j) => {
      n++;
      const k = `${pref(r, s)}${i}-${j}`, ok = !!hechos[k];
      const info = infoEj(it);
      const conPeso = esDia && !r.sinPeso && !info.cardio && !/pasadas|^—$/.test(it.s);
      html += `<article class="ej${ok ? " hecho" : ""}" data-k="${k}">
        <div class="ej-info">
          <div class="ej-num">${n}</div>
          <div>
            <div class="ej-nombre">${esc(info.nombre)}</div>
            <div class="tags"><span class="tag">${esc(it.s)}</span>${it.t ? `<span class="tag aviso">⚠️ ${esc(it.t)}</span>` : ""}</div>
          </div>
          <button class="check" aria-label="Marcar como hecho" aria-pressed="${ok}">
            <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        ${info.cardio
          ? `<div class="cardio"><span class="ico">🏃</span><div><b>${esc(it.s)}</b>${esc(it.c || "A tu ritmo")}</div></div>`
          : `<div class="videos${info.vids.length > 1 ? " varios" : ""}">${info.vids.map(v => unVideo(v.v, v.label)).join("")}</div>`}
        ${conPeso ? `<div class="ej-pie"><div class="peso"><label for="p-${k}">Peso</label>
          <input id="p-${k}" data-p="${r.id}/${it.e}" inputmode="decimal" placeholder="—" value="${esc(pesos[r.id + "/" + it.e] || "")}"><span>kg</span></div></div>` : ""}
      </article>`;
    });
    html += `</div></section>`;
  });
  if(esDia && r.pie) html += `<div class="nota">ℹ️<div>${esc(r.pie)}</div></div>`;
  html += `<button class="reiniciar" id="reiniciar">↺ Reiniciar ${esDia ? "este día" : "esta sección"}</button>`;
  $("#contenido").innerHTML = html;
  requestAnimationFrame(pintarProgreso);
  animarEntrada();
  $("#reiniciar").onclick = () => {
    Object.keys(hechos).forEach(k => { if(k.startsWith(pref(r, s))) delete hechos[k]; });
    guardarHechos(); pintarSeccion(s); pintarDias(); toast("Reiniciado");
  };
}

/* ================= eventos ================= */
document.addEventListener("click", ev => {
  const f = ev.target.closest(".filtro");
  if(f){ filtro = f.dataset.f; verInicio(); return; }
  const rc = ev.target.closest(".rut-card");
  if(rc){ verRutina(RUTINAS.find(r => r.id === rc.dataset.r), null, false); window.scrollTo({ top:0 }); return; }
  const dc = ev.target.closest(".dia-card");
  if(dc){ actual = dc.dataset.s; verRutina(rutina, actual, true); return; }
  const chk = ev.target.closest(".check");
  if(chk){
    const art = chk.closest(".ej"), k = art.dataset.k, s = rutina.secciones.find(x => x.id === actual);
    const antes = hechosDe(rutina, s) === total(rutina, s);
    if(hechos[k]) delete hechos[k]; else hechos[k] = true;
    guardarHechos();
    art.classList.toggle("hecho", !!hechos[k]); chk.setAttribute("aria-pressed", !!hechos[k]);
    if(hechos[k] && navigator.vibrate) navigator.vibrate(15);
    pintarProgreso(); pintarDias();
    if(!antes && hechosDe(rutina, s) === total(rutina, s)){ confeti(); toast("¡Terminaste el " + s.titulo + "! 🎉"); }
    return;
  }
  const v = ev.target.closest(".video[data-yt]");
  if(v) reproducir(v);
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape") cerrarSheet();
  const v = e.target.closest && e.target.closest(".video[data-yt]");
  if(v && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); reproducir(v); }
});
document.addEventListener("input", e => {
  const p = e.target.dataset && e.target.dataset.p;
  if(!p) return;
  const val = e.target.value.trim();
  if(val) pesos[p] = val; else delete pesos[p];
  grabar("hg-pesos", pesos);
  // mismo ejercicio en otro bloque del día: lo sincroniza
  document.querySelectorAll(`input[data-p="${p}"]`).forEach(i => { if(i !== e.target) i.value = val; });
});
$("#volver").onclick = () => { verInicio(); window.scrollTo({ top: 0, behavior: "smooth" }); };

function reproducir(v){
  if(location.protocol === "file:"){
    toast("Los videos funcionan cuando la página está publicada");
    window.open("https://www.youtube.com/watch?v=" + v.dataset.yt, "_blank", "noopener");
    return;
  }
  v.innerHTML = `<iframe src="https://www.youtube.com/embed/${v.dataset.yt}?autoplay=1&rel=0&playsinline=1&origin=${encodeURIComponent(location.origin)}"
    title="Video del ejercicio" referrerpolicy="strict-origin-when-cross-origin"
    allow="autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>`;
  v.removeAttribute("data-yt"); v.removeAttribute("role"); v.removeAttribute("tabindex"); v.style.cursor = "default";
}

/* animación al hacer scroll */
let obs = null;
function animarEntrada(){
  const els = document.querySelectorAll(".ej");
  if(!("IntersectionObserver" in window)){ els.forEach(e => e.classList.add("visible")); return; }
  if(obs) obs.disconnect();
  obs = new IntersectionObserver(ents => ents.forEach(en => {
    if(en.isIntersecting){ en.target.classList.add("visible"); obs.unobserve(en.target); }
  }), { threshold: .08, rootMargin: "0px 0px -30px 0px" });
  els.forEach((e, i) => { e.style.transitionDelay = (i % 3) * 70 + "ms"; obs.observe(e); });
}

/* ================= confeti y avisos ================= */
function confeti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colores = ["#49B114","#6cc93a","#a8e57f","#facc15","#ffffff","#2a6e08"];
  for(let i = 0; i < 70; i++){
    const c = document.createElement("div");
    c.className = "confeti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colores[i % colores.length];
    c.style.animationDuration = 1.8 + Math.random() * 1.6 + "s";
    c.style.animationDelay = Math.random() * .4 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}
let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("ver");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("ver"), 2600);
}

/* ================= temporizador de descanso ================= */
let seg = 60, quedan = 0, intervalo = null;
const C_RELOJ = 2 * Math.PI * 52;
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function abrirSheet(){ document.body.classList.add("abierto"); }
function cerrarSheet(){ document.body.classList.remove("abierto"); }
function pintarReloj(){
  $("#reloj-txt").textContent = fmt(intervalo ? quedan : seg);
  $("#reloj-valor").style.strokeDashoffset = intervalo ? C_RELOJ * (1 - quedan / seg) : 0;
  $("#fab-txt").textContent = intervalo ? fmt(quedan) : "Descanso";
  $("#fab").classList.toggle("corriendo", !!intervalo);
}
function iniciar(s){
  seg = s; quedan = s; clearInterval(intervalo);
  intervalo = setInterval(() => {
    quedan--;
    if(quedan <= 0){
      clearInterval(intervalo); intervalo = null;
      if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
      toast("⏰ ¡A la siguiente serie!");
    }
    pintarReloj();
  }, 1000);
  pintarReloj();
  setTimeout(cerrarSheet, 500);
}
$("#fab").onclick = abrirSheet;
$("#sheet-fondo").onclick = cerrarSheet;
document.querySelectorAll(".tiempos button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tiempos button").forEach(x => x.classList.toggle("sel", x === b));
  iniciar(+b.dataset.s);
});
$("#parar").onclick = () => { clearInterval(intervalo); intervalo = null; pintarReloj(); cerrarSheet(); };

/* ================= tema claro / oscuro ================= */
try { const t = localStorage.getItem("tema"); if(t) document.documentElement.dataset.theme = t; } catch(e) {}
$("#tema").onclick = () => {
  const oscuroAhora = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const nuevo = oscuroAhora ? "light" : "dark";
  document.documentElement.dataset.theme = nuevo;
  try { localStorage.setItem("tema", nuevo); } catch(e) {}
};

/* ================= rutas (#rutina/dia) ================= */
function ponerHash(h){ try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch(e) {} }
function arrancar(){
  const [rid, sid] = location.hash.slice(1).split("/");
  const viejos = { calentamiento:1, abs:1, dia1:1, dia2:1, dia3:1, dia4:1, dia5:1 }; // links de la versión anterior
  let r = RUTINAS.find(x => x.id === rid);
  if(!r && viejos[rid]) { r = RUTINAS[0]; return verRutina(r, rid.replace("dia", "d"), false); }
  if(r) return verRutina(r, sid, false);
  verInicio();
}
window.addEventListener("hashchange", arrancar);
arrancar();
pintarReloj();
</script>
